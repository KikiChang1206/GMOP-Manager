<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小樹苗成長日記 · 電腦版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f0e0;
    --paper-line:#e6dabf;
    --ink:#4a4038;
    --ink-soft:#8a7d6b;
    --leaf:#8fc47a;
    --leaf-dark:#5f9650;
    --sun:#f4dd9e;
    --sky:#b9d3e0;
    --flower:#f3bcc8;
    --soil:#a9835f;
    --stamp:#c96a5f;
    --stamp-bg:#fbeae6;
    --card:#fffdf8;
    --sidebar:#fffdf8;
    --shadow: 0 3px 10px rgba(74,64,56,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 27px,
        var(--paper-line) 27px,
        var(--paper-line) 28px
      ), var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:320px;
    flex:none;
    background:var(--sidebar);
    border-right:1.5px solid var(--paper-line);
    padding:26px 24px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{ text-align:center; margin-bottom:6px; }
  .brand h1{
    font-family:"Klee One",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:21px;
    margin:0 0 4px;
    font-weight:600;
  }
  .brand .sub{
    font-family:"Fredoka",sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:1.5px;
    font-weight:500;
  }
  #btnRefresh{
    display:block;
    width:100%;
    margin:10px 0 4px;
    border:none;background:none;color:var(--ink-soft);
    font-size:12px;text-decoration:underline;cursor:pointer;
  }

  .plant-row{
    display:flex;
    gap:14px;
    padding:4px 0 24px;
    flex-wrap:nowrap;
    overflow-x:auto;
  }
  .plant-slot{
    flex:none;
    width:96px;
    text-align:center;
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:14px;
    padding:12px 6px 10px;
    box-shadow:var(--shadow);
  }
  .plant-slot.locked{ opacity:0.55; box-shadow:none; }
  .plant-slot svg{ display:block; margin:0 auto; filter:drop-shadow(0 3px 5px rgba(74,64,56,0.10)); }
  .plant-slot .m-label{ font-family:"Fredoka",sans-serif; font-size:12px; font-weight:600; color:var(--ink); margin-top:4px; }
  .plant-slot .m-status{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; line-height:1.3; }
  .plant-intro{ font-size:13px; color:var(--ink-soft); padding:4px 0 20px; }
  @keyframes growPop{
    0%{ transform:scale(0.85); opacity:0.4; }
    60%{ transform:scale(1.06); opacity:1; }
    100%{ transform:scale(1); }
  }
  .plant-slot.grow-in svg{ animation:growPop 0.5s ease; }

  .compose{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:4px 4px 14px 14px;
    padding:22px 18px 18px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .compose::before{
    content:"🌿";
    position:absolute;
    top:-15px;
    left:22px;
    font-size:20px;
    transform:rotate(-8deg);
  }
  .compose label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:700;
  }
  .compose input, .compose textarea{
    width:100%;
    border:none;
    border-bottom:2px dashed var(--paper-line);
    padding:8px 4px;
    font-size:14.5px;
    font-family:inherit;
    background:transparent;
    color:var(--ink);
    margin-bottom:16px;
    resize:vertical;
  }
  .compose input:focus, .compose textarea:focus{
    outline:none;
    border-bottom-color:var(--leaf-dark);
  }
  .compose textarea{min-height:110px;}
  .compose button.submit{
    width:100%;
    border:2px solid var(--ink);
    background:var(--leaf);
    color:var(--ink);
    padding:11px 0;
    border-radius:20px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);
  }
  .compose button.submit:active{ transform:translate(2px,2px); box-shadow:none; }

  .stats{
    margin-top:6px;
    padding-top:16px;
    border-top:1.5px dashed var(--paper-line);
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.9;
  }
  .stats b{ color:var(--ink); font-family:"Fredoka",sans-serif; }

  .main{ flex:1; padding:32px 36px; min-width:0; }
  .board-title{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; font-weight:600; }
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:22px 20px;
    align-items:start;
  }

  .entry{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:4px 4px 14px 14px;
    box-shadow:var(--shadow);
  }
  .entry::before{
    content:"🌱";
    position:absolute;
    top:-13px;
    left:20px;
    font-size:18px;
  }
  .entry.tape-1::before{ content:"🌿"; }
  .entry.tape-2::before{ content:"🍃"; }
  .entry.tape-3::before{ content:"🌼"; }

  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 14px 6px;
  }
  .entry-head .who{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    background:var(--leaf);
    padding:2px 10px;
    border-radius:10px;
  }
  .entry-head .when{
    font-family:"Fredoka",sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .entry-body{
    padding:6px 16px 14px;
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .status-row{ padding:0 16px 12px; }
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    font-weight:700;
    padding:4px 12px;
    border-radius:20px;
  }
  .status-badge.wait{
    background:#fff;
    color:var(--stamp);
    border:2px dashed var(--stamp);
  }
  .status-badge.done{
    background:var(--stamp);
    color:#fff;
    transform:rotate(-3deg);
    border:2px solid var(--stamp);
  }

  .reply-block{
    position:relative;
    margin:0 14px 16px;
    background:var(--stamp-bg);
    border-radius:10px;
    padding:14px 14px 12px;
    transform:rotate(-0.6deg);
    box-shadow:1px 2px 6px rgba(201,106,95,0.15);
  }
  .reply-block::before{
    content:"🌳";
    position:absolute;
    top:-14px;
    left:16px;
    font-size:18px;
  }
  .reply-block .label{ font-size:11.5px; font-weight:700; color:var(--stamp); margin-bottom:6px; }
  .reply-text{ font-size:13.5px; line-height:1.65; color:#5a3530; white-space:pre-wrap; word-break:break-word; }
  .reply-meta{ font-family:"Fredoka",sans-serif; font-size:10.5px; color:#b3847c; margin-top:8px; font-weight:500; }
  .reply-waiting{
    margin:0 14px 16px;
    padding:12px 14px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    border:2px dashed var(--paper-line);
    border-radius:10px;
  }

  .empty-hint{
    grid-column:1/-1;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:60px 20px;
    line-height:1.8;
  }
  .empty-hint .big{ font-size:32px; display:block; margin-bottom:10px; }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:10px 22px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1.5px solid var(--paper-line); }
    .main{ padding:24px 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>小樹苗成長日記</h1>
      <div class="sub">GOODMAJI · 每篇留言都在長大</div>
    </div>
    <button id="btnRefresh">🔄 更新留言</button>
    <div id="composeArea"></div>
    <div class="stats" id="statsArea"></div>
  </aside>

  <main class="main">
    <div id="plantArea"></div>
    <div class="board-title" id="boardTitle">小樹苗的話</div>
    <div class="board" id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
let entries = [];
let staffLoggedIn = false;
let testMode = false;
let staffAuthor = '';
let staffPassword = '';

const listEl = document.getElementById('list');
const composeArea = document.getElementById('composeArea');
const plantArea = document.getElementById('plantArea');
const statsArea = document.getElementById('statsArea');
const boardTitle = document.getElementById('boardTitle');
const toastEl = document.getElementById('toast');

// 貼上你部署 Google Apps Script 後拿到的網址（結尾是 /exec）
const API_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDateOnly(dateStr){
  if(!dateStr) return '';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  return `${parts[1]}/${parts[2]}`;
}

// ---------- 小樹苗成長圖(6個月，依天數自動生長，每個月造型不同) ----------
function speciesDef(idx){
  const list = [
    { name:'嫩芽小樹', leaf:'#8fc47a', leafLight:'#9ed184', stem:'#5f9650', topper:'leaf' },
    { name:'竹之子',   leaf:'#7bbf8a', leafLight:'#9fd9ac', stem:'#4c8f5e', topper:'bamboo' },
    { name:'小向日葵', leaf:'#8fc47a', leafLight:'#f4dd9e', stem:'#5f9650', topper:'sunflower' },
    { name:'幸運草叢', leaf:'#6fae80', leafLight:'#8ecb9e', stem:'#4a7d5c', topper:'clover' },
    { name:'櫻花小徑', leaf:'#8fc47a', leafLight:'#f3bcc8', stem:'#5f9650', topper:'blossom' },
    { name:'豐收果樹', leaf:'#7fb968', leafLight:'#9ed184', stem:'#7a5a3a', topper:'fruit' }
  ];
  return list[idx % list.length];
}

function stageFromFraction(f){
  if(f <= 0.02) return 0;
  if(f < 0.2) return 1;
  if(f < 0.4) return 2;
  if(f < 0.65) return 3;
  if(f < 0.9) return 4;
  return 5;
}

function drawTopper(sp, x, y){
  let s = '';
  if(sp.topper === 'bamboo'){
    s += `<path d="M${x} ${y+45} L${x} ${y-10}" stroke="${sp.stem}" stroke-width="7" stroke-linecap="round" fill="none"/>`;
    [10,25,38].forEach(off=>{
      s += `<path d="M${x-6} ${y+45-off} L${x+6} ${y+45-off}" stroke="${sp.leafLight}" stroke-width="3" stroke-linecap="round"/>`;
    });
    s += `<ellipse cx="${x-8}" cy="${y-14}" rx="9" ry="3" fill="${sp.leaf}" transform="rotate(-20 ${x-8} ${y-14})"/>`;
    s += `<ellipse cx="${x+8}" cy="${y-16}" rx="9" ry="3" fill="${sp.leaf}" transform="rotate(20 ${x+8} ${y-16})"/>`;
  } else if(sp.topper === 'sunflower'){
    s += `<path d="M${x} ${y+45} L${x} ${y-2}" stroke="${sp.stem}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
    for(let a=0; a<8; a++){
      const ang = a * Math.PI/4;
      const px = x + Math.cos(ang)*15, py = (y-14) + Math.sin(ang)*15;
      s += `<ellipse cx="${px}" cy="${py}" rx="6" ry="3.5" fill="${sp.leafLight}" transform="rotate(${a*45} ${px} ${py})"/>`;
    }
    s += `<circle cx="${x}" cy="${y-14}" r="9" fill="#8a5d34"/>`;
  } else if(sp.topper === 'clover'){
    s += `<path d="M${x} ${y+45} L${x} ${y+10}" stroke="${sp.stem}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
    [[x-14,y+2],[x+14,y+2],[x,y-14],[x-10,y-24],[x+10,y-24]].forEach(([cx,cy])=>{
      s += `<circle cx="${cx-4}" cy="${cy}" r="6" fill="${sp.leaf}"/>`;
      s += `<circle cx="${cx+4}" cy="${cy}" r="6" fill="${sp.leafLight}"/>`;
      s += `<circle cx="${cx}" cy="${cy-5}" r="6" fill="${sp.leaf}"/>`;
    });
  } else if(sp.topper === 'blossom'){
    s += `<path d="M${x} ${y+45} L${x} ${y-6}" stroke="${sp.stem}" stroke-width="7" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${x}" cy="${y-16}" r="20" fill="${sp.leaf}"/>`;
    s += `<circle cx="${x-16}" cy="${y-2}" r="12" fill="${sp.leafLight}"/>`;
    s += `<circle cx="${x+16}" cy="${y-2}" r="12" fill="${sp.leafLight}"/>`;
    s += `<circle cx="${x}" cy="${y-32}" r="12" fill="${sp.leafLight}"/>`;
    [[-10,-14],[10,-10],[0,-28],[-14,-2],[14,-4]].forEach(([dx,dy])=>{
      s += `<circle cx="${x+dx}" cy="${y+dy}" r="2.2" fill="#e79cb0"/>`;
    });
  } else if(sp.topper === 'fruit'){
    s += `<path d="M${x} ${y+45} L${x} ${y-4}" stroke="${sp.stem}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${x}" cy="${y-16}" r="22" fill="${sp.leaf}"/>`;
    s += `<circle cx="${x-15}" cy="${y-2}" r="13" fill="${sp.leafLight}"/>`;
    s += `<circle cx="${x+15}" cy="${y-2}" r="13" fill="${sp.leafLight}"/>`;
    [[-9,-10],[10,-14],[-2,-26],[13,4],[-15,6]].forEach(([dx,dy])=>{
      s += `<circle cx="${x+dx}" cy="${y+dy}" r="3" fill="#d9694a"/>`;
    });
  } else {
    s += `<path d="M${x} ${y+45} L${x} ${y-8}" stroke="${sp.stem}" stroke-width="7" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${x}" cy="${y-18}" r="20" fill="${sp.leaf}"/>`;
    s += `<circle cx="${x-16}" cy="${y-4}" r="13" fill="${sp.leafLight}"/>`;
    s += `<circle cx="${x+16}" cy="${y-4}" r="13" fill="${sp.leafLight}"/>`;
  }
  return s;
}

function drawPlant(fraction, sp){
  const stage = stageFromFraction(fraction);
  let s = '';
  s += `<ellipse cx="60" cy="128" rx="40" ry="9" fill="#c8a877"/>`;
  s += `<ellipse cx="60" cy="125" rx="34" ry="7" fill="#a9835f"/>`;

  if(stage === 0){
    s += `<ellipse cx="60" cy="118" rx="7" ry="5" fill="#d9b877"/>`;
    s += `<ellipse cx="58" cy="116" rx="2" ry="1.5" fill="#f4dd9e"/>`;
  } else if(stage === 1){
    s += `<path d="M60 122 L60 105" stroke="${sp.stem}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    s += `<ellipse cx="52" cy="102" rx="9" ry="6" fill="${sp.leaf}" transform="rotate(-25 52 102)"/>`;
    s += `<ellipse cx="68" cy="102" rx="9" ry="6" fill="${sp.leaf}" transform="rotate(25 68 102)"/>`;
  } else if(stage === 2){
    s += `<path d="M60 122 L60 80" stroke="${sp.stem}" stroke-width="5" stroke-linecap="round" fill="none"/>`;
    s += `<ellipse cx="48" cy="100" rx="11" ry="7" fill="${sp.leaf}" transform="rotate(-30 48 100)"/>`;
    s += `<ellipse cx="72" cy="100" rx="11" ry="7" fill="${sp.leaf}" transform="rotate(30 72 100)"/>`;
    s += `<ellipse cx="46" cy="82" rx="10" ry="6" fill="${sp.leafLight}" transform="rotate(-20 46 82)"/>`;
    s += `<ellipse cx="74" cy="82" rx="10" ry="6" fill="${sp.leafLight}" transform="rotate(20 74 82)"/>`;
  } else if(stage === 3){
    s += `<path d="M60 122 L60 60" stroke="${sp.stem}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
    s += `<path d="M60 95 L40 85" stroke="${sp.stem}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    s += `<path d="M60 80 L82 70" stroke="${sp.stem}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="60" cy="58" r="16" fill="${sp.leaf}"/>`;
    s += `<circle cx="38" cy="83" r="10" fill="${sp.leafLight}"/>`;
    s += `<circle cx="84" cy="68" r="10" fill="${sp.leafLight}"/>`;
  } else {
    s += drawTopper(sp, 60, 78);
  }
  return s;
}

function addMonths(date, n){
  const d = new Date(date.getTime());
  d.setMonth(d.getMonth() + n);
  return d;
}
function daysBetween(a, b){
  return Math.floor((b.setHours(0,0,0,0) - a.setHours(0,0,0,0)) / 86400000);
}

function renderPlantRow(){
  if(!staffLoggedIn){
    plantArea.innerHTML = `<div class="plant-intro">🔑 登入後可以看到你的 6 顆小樹苗</div>`;
    return;
  }
  if(entries.length === 0){
    plantArea.innerHTML = `<div class="plant-intro">🌱 寫下第一篇留言，展開你的 6 個月小樹苗旅程！</div>`;
    return;
  }

  const dates = entries.map(e => new Date(e.entryDate || e.createdAt)).filter(d => !isNaN(d));
  const startDate = new Date(Math.min(...dates.map(d=>d.getTime())));
  const today = new Date();

  let html = '<div class="plant-row">';
  for(let m = 1; m <= 6; m++){
    const mStart = addMonths(startDate, m - 1);
    const mEnd = addMonths(startDate, m);
    const totalDays = Math.max(1, daysBetween(new Date(mStart), new Date(mEnd)));
    const sp = speciesDef(m - 1);

    if(today < mStart){
      html += `
        <div class="plant-slot locked">
          <svg viewBox="0 0 120 140" width="64" height="74">
            <ellipse cx="60" cy="128" rx="40" ry="9" fill="#ddd6c4"/>
            <ellipse cx="60" cy="118" rx="7" ry="5" fill="#c9c2ae"/>
          </svg>
          <div class="m-label">第${m}個月</div>
          <div class="m-status">尚未開始</div>
        </div>
      `;
    } else {
      const elapsed = Math.min(totalDays, Math.max(0, daysBetween(new Date(mStart), new Date(today))) + 1);
      const fraction = today >= mEnd ? 1 : elapsed / totalDays;
      const done = today >= mEnd;
      html += `
        <div class="plant-slot grow-in">
          <svg viewBox="0 0 120 140" width="64" height="74">${drawPlant(fraction, sp)}</svg>
          <div class="m-label">第${m}個月</div>
          <div class="m-status">${done ? '已完成 🎉' : `第 ${elapsed}/${totalDays} 天`}</div>
        </div>
      `;
    }
  }
  html += '</div>';
  plantArea.innerHTML = html;
}

async function loadMyEntries(){
  try{
    const url = `${API_URL}?action=myEntries&author=${encodeURIComponent(staffAuthor)}&password=${encodeURIComponent(staffPassword)}`;
    const res = await fetch(url);
    const data = await res.json();
    entries = (data.entries || []).slice().reverse();
  }catch(e){
    entries = [];
    showToast('讀取失敗，請檢查網路連線');
  }
}

async function postToSheet(payload){
  try{
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return true;
  }catch(e){
    showToast('連線失敗，請重試');
    return false;
  }
}

async function staffLogin(){
  const nameEl = document.getElementById('loginName');
  const passEl = document.getElementById('loginPassword');
  const name = nameEl.value.trim();
  const pass = passEl.value;
  if(!name || !pass){ showToast('請輸入姓名與密碼'); return; }
  try{
    const url = `${API_URL}?action=login&author=${encodeURIComponent(name)}&password=${encodeURIComponent(pass)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.success){
      staffLoggedIn = true;
      staffAuthor = name;
      staffPassword = pass;
      showToast('登入成功 🌱');
      await loadMyEntries();
      render();
    } else {
      showToast('姓名或密碼不正確');
    }
  }catch(e){
    showToast('連線失敗，請重試');
  }
}

function testLogin(){
  testMode = true;
  staffLoggedIn = true;
  staffAuthor = '測試小樹苗';
  staffPassword = '';
  entries = [];
  showToast('已進入測試模式（不會真的存到試算表）');
  render();
}

function staffLogout(){
  staffLoggedIn = false;
  staffAuthor = '';
  staffPassword = '';
  testMode = false;
  entries = [];
  render();
}

function renderComposeArea(){
  if(!staffLoggedIn){
    boardTitle.textContent = '小樹苗的話';
    composeArea.innerHTML = `
      <div class="compose">
        <label>姓名</label>
        <input id="loginName" type="text" placeholder="例如：阿明">
        <label>密碼</label>
        <input id="loginPassword" type="password" placeholder="請輸入密碼">
        <button class="submit" id="loginBtn">🔑 登入</button>
        <button id="testLoginBtn" style="width:100%;margin-top:10px;border:none;background:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;">🧪 先不接帳密，直接看介面</button>
      </div>
    `;
    document.getElementById('loginBtn').onclick = staffLogin;
    document.getElementById('testLoginBtn').onclick = testLogin;
  } else {
    boardTitle.textContent = `${staffAuthor} 的心情日記`;
    composeArea.innerHTML = `
      <div class="compose">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="font-size:13.5px;font-weight:700;">🌱 ${escapeHtml(staffAuthor)}${testMode ? ' <span style=\'font-size:10.5px;color:var(--ink-soft);\'>(測試模式)</span>' : ''}</span>
          <button id="logoutBtn" style="border:none;background:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;">登出</button>
        </div>
        <label>日期</label>
        <input id="entryDateInput" type="date" value="${todayStr()}">
        <label>小樹苗的話</label>
        <textarea id="contentInput" placeholder="今天想說的話、遇到的事，都可以寫在這裡..."></textarea>
        <button class="submit" id="submitBtn">✒️ 送出</button>
      </div>
    `;
    document.getElementById('submitBtn').onclick = submitEntry;
    document.getElementById('logoutBtn').onclick = staffLogout;
  }
}

async function submitEntry(){
  const dateInput = document.getElementById('entryDateInput');
  const contentInput = document.getElementById('contentInput');
  const entryDate = dateInput.value || todayStr();
  const content = contentInput.value.trim();
  if(!content){ showToast('請填寫內容'); return; }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    author: staffAuthor,
    entryDate,
    content,
    createdAt: new Date().toISOString(),
    reply: '',
    repliedAt: ''
  };

  if(testMode){
    entries.unshift(entry);
    contentInput.value = '';
    showToast('已送出，小樹苗長大了一點 🌱');
    render();
    return;
  }

  const ok = await postToSheet({
    action:'add', id:entry.id, author:staffAuthor, password:staffPassword,
    entryDate, content:entry.content, createdAt:entry.createdAt
  });
  if(ok){
    entries.unshift(entry);
    contentInput.value = '';
    showToast('已送出，小樹苗長大了一點 🌱');
    render();
  }
}

function renderStats(){
  if(!staffLoggedIn){ statsArea.innerHTML = ''; return; }
  const total = entries.length;
  const waiting = entries.filter(e=>!e.reply).length;
  const done = total - waiting;
  statsArea.innerHTML = `共 <b>${total}</b> 則留言<br>待回覆 <b>${waiting}</b> ・ 已回覆 <b>${done}</b>`;
}

function renderList(){
  if(!staffLoggedIn){
    listEl.innerHTML = `<div class="empty-hint"><span class="big">🔑</span>登入後才能看到你的留言。</div>`;
    return;
  }

  const list = entries;
  if(list.length === 0){
    listEl.innerHTML = `<div class="empty-hint"><span class="big">🌱</span>你還沒有留言，寫下今天的第一則吧。</div>`;
    return;
  }

  listEl.innerHTML = list.map((e, i)=>{
    const tapeClass = 'tape-' + (i % 4);
    const statusBadge = e.reply
      ? `<span class="status-badge done">✓ 已回覆</span>`
      : `<span class="status-badge wait">⏳ 待回覆</span>`;

    const replySection = e.reply
      ? `
        <div class="reply-block">
          <div class="label">大樹的叮嚀</div>
          <div class="reply-text">${escapeHtml(e.reply)}</div>
          <div class="reply-meta">回覆於 ${fmtDateTime(e.repliedAt)}</div>
        </div>
      `
      : `<div class="reply-waiting">🌳 大樹還沒有回覆</div>`;

    return `
      <div class="entry ${tapeClass}">
        <div class="entry-head">
          <span class="who">${escapeHtml(e.author)}</span>
          <span class="when">${fmtDateOnly(e.entryDate)}</span>
        </div>
        <div class="entry-body">${escapeHtml(e.content)}</div>
        <div class="status-row">${statusBadge}</div>
        ${replySection}
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  renderPlantRow();
  renderComposeArea();
  renderStats();
  renderList();
}

document.getElementById('btnRefresh').onclick = async ()=>{
  if(testMode){
    showToast('測試模式沒有連線，畫面本來就是最新的');
    render();
    return;
  }
  if(staffLoggedIn){ await loadMyEntries(); }
  showToast('已更新');
  render();
};

render();
</script>
</body>
</html>
