// ── Signature Pad (fullscreen) ───────────────────────────
function SignaturePad({ onSave, onCancel, customer }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const lastPos = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }, []);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  };

  const start = (e) => { e.preventDefault(); drawing.current = true; lastPos.current = getPos(e, canvasRef.current); };
  const move = (e) => {
    e.preventDefault();
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath(); ctx.moveTo(lastPos.current.x, lastPos.current.y); ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = "#1A4A8A"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
    lastPos.current = pos;
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const canvas = canvasRef.current; const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  };
  const save = () => onSave(canvasRef.current.toDataURL("image/png"));

  return (
    <div style={{ position: "fixed", inset: 0, background: C.white, zIndex: 400, display: "flex", flexDirection: "column" }}>
      <div style={{ background: `linear-gradient(135deg,${C.navy},${C.blue})`, padding: "16px 20px", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
        <button onClick={onCancel} style={{ background: "rgba(255,255,255,0.15)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 10, padding: "8px 14px", color: C.white, fontSize: 13, cursor: "pointer" }}>← 返回</button>
        <div style={{ flex: 1 }}>
          <div style={{ color: C.white, fontWeight: 800, fontSize: 15 }}>✍️ 客戶簽收</div>
          <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>{customer}</div>
        </div>
        <button onClick={clear} style={{ background: "rgba(255,255,255,0.15)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 10, padding: "8px 14px", color: C.white, fontSize: 13, cursor: "pointer" }}>清除</button>
      </div>
      <div style={{ background: C.blueSoft, padding: "10px 20px", textAlign: "center", fontSize: 13, color: C.blue, fontWeight: 600, flexShrink: 0 }}>
        請客戶在下方空白處簽名
      </div>
      <div style={{ flex: 1, background: "#FAFBFF", display: "flex", alignItems: "stretch", padding: 16, overflow: "hidden" }}>
        <canvas ref={canvasRef} width={700} height={900}
          style={{ width: "100%", height: "100%", border: `2px dashed ${C.blueLight}`, borderRadius: 16, touchAction: "none", cursor: "crosshair", background: C.white, boxShadow: C.shadow }}
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      </div>
      <div style={{ padding: "16px 20px 40px", background: C.white, borderTop: `1px solid ${C.grayBorder}`, flexShrink: 0 }}>
        <button onClick={save} style={{ width: "100%", background: `linear-gradient(135deg,${C.green},#27855A)`, border: "none", borderRadius: 14, padding: 16, color: C.white, fontSize: 16, fontWeight: 800, cursor: "pointer" }}>
          ✅ 簽名完成
        </button>
      </div>
    </div>
  );
}

            {photoUrl ? "📷 已拍照 ✓" : "📷 需要拍照"}
          </button>

        {sigData && (

              <input type="file" accept="image/*" capture="environment" onChange={handlePhoto} style={{ display:"none" }} />

        )}

          <div style={{ marginBottom:16, position:"relative" }}>
            <img src={photoUrl} style={{ width:"100%", borderRadius:12, maxHeight:200, objectFit:"cover" }} />

    </>
  );
}

// ── My Cases Tab ────────────────────────────────────────
function MyCasesTab({ cases, me, onAccept, onPickup, onReject, onUndo, onReorder, onSession }) {
  const [section, setSection] = useState(0);
  const [sortMode, setSortMode] = useState(false);
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const listRef = useRef(null);
  const myCases = cases.filter(c => c.driver_id === me);
  const sections = [
    { label:"新案件", color:C.blue,  cases: myCases.filter(c=>c.status==="已指派") },
    { label:"待取件", color:C.navy,  cases: myCases.filter(c=>c.status==="待取件"||c.status==="已接單").sort((a,b)=>a.order-b.order) },
    { label:"已取件", color:C.green, cases: myCases.filter(c=>c.status==="已取件") },
  ];
  const cur = sections[section];

  const getClientY = e => (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY);
  const handleDragStart = (idx) => (e) => { setDragIdx(idx); setOverIdx(idx); };
  const handleDragMove = (e) => {
    if (dragIdx===null || !listRef.current) return;
    e.preventDefault();
    const y = getClientY(e);
    const cardEls = Array.from(listRef.current.children);
    let closest = overIdx, minDist = Infinity;
    cardEls.forEach((el,i) => {
      const rect = el.getBoundingClientRect();
      const dist = Math.abs(y - (rect.top+rect.height/2));
      if (dist < minDist) { minDist = dist; closest = i; }
    });
    if (closest !== overIdx) setOverIdx(closest);
  };
  const handleDragEnd = () => {
    if (dragIdx!==null && overIdx!==null && dragIdx!==overIdx) onReorder(me, dragIdx, overIdx);
    setDragIdx(null); setOverIdx(null);
  };

  return (
    <>
      <div style={{ background:C.white, padding:"10px 14px", borderBottom:`1px solid ${C.grayBorder}`, display:"flex", gap:8 }}>
        {sections.map((s,i) => (
          <button key={i} onClick={() => { setSection(i); setSortMode(false); }}
            style={{ flex:1, background:section===i?s.color:C.grayLight, border:"none", borderRadius:10, padding:"9px 4px", color:section===i?C.white:C.gray, fontWeight:section===i?800:500, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:4 }}>
            {s.label}
            {s.cases.length>0 && <span style={{ background:section===i?"rgba(255,255,255,0.3)":C.grayBorder, borderRadius:8, fontSize:11, padding:"0 5px", fontWeight:800 }}>{s.cases.length}</span>}
          </button>
        ))}
      </div>
      <div style={{ padding:"14px 12px 80px" }}>
        {section===1 && cur.cases.length>0 && (
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            {cur.cases.length>1 && (
              <button onClick={() => setSortMode(m=>!m)}
                style={{ flex:1, background:sortMode?C.blue:C.grayLight, border:`1.5px solid ${sortMode?C.blue:C.grayBorder}`, borderRadius:10, padding:"10px 6px", color:sortMode?C.white:C.gray, fontSize:12, fontWeight:700, cursor:"pointer" }}>
                {sortMode?"✅ 完成排序":"⇅ 排順序"}
              </button>
            )}
            {!sortMode && (() => {
              const addrs = cur.cases.map(c=>c.address);
              const destination = mapAddr(addrs[addrs.length-1]);
              const waypoints = addrs.slice(0,-1).map(a=>mapAddr(a)).join("|");
              const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${destination}` + (waypoints?`&waypoints=${waypoints}`:"") + "&travelmode=driving";
              return (
                <a href={routeUrl} target="_blank" rel="noreferrer"
                  style={{ flex:2, background:`linear-gradient(135deg,${C.blue},${C.blueMid})`, borderRadius:10, padding:"10px 6px", color:C.white, fontSize:12, fontWeight:800, textDecoration:"none", textAlign:"center", display:"flex", alignItems:"center", justifyContent:"center", gap:5, boxShadow:C.shadowBlue }}>
                  🗺️ 一鍵全程導航
                </a>
              );
            })()}
          </div>
        )}
        {cur.cases.length===0 && <div style={{ textAlign:"center", padding:"60px 20px" }}><div style={{ fontSize:44 }}>📭</div><div style={{ color:C.textMuted, fontSize:14, marginTop:10 }}>目前沒有{cur.label}案件</div></div>}
        <div ref={section===1 ? listRef : null}>
          {cur.cases.map((c,idx) => (
            <CaseCard key={c.id} c={c} idx={idx} total={cur.cases.length}
              sortMode={sortMode}
              isDragging={dragIdx===idx}
              onDragStart={section===1 ? handleDragStart(idx) : undefined}
              onDragMove={section===1 ? handleDragMove : undefined}
              onDragEnd={section===1 ? handleDragEnd : undefined}
              onAccept={() => onAccept(c.id)}
              onPickup={() => onPickup(c.id)}
              onReject={() => onReject(c.id)}
              onUndo={() => onUndo(c.id)} />
          ))}
        </div>
      </div>
    </>
  );
}

// ── Team Tab ────────────────────────────────────────────
function TeamTab({ cases, me, onReorder, onSession }) {
  const [driverIdx, setDriverIdx] = useState(0);
  const [sortMode, setSortMode] = useState(false);
  const TEAM_DRIVERS = DRIVERS.filter(d => d.id !== me);
  const driver = TEAM_DRIVERS[driverIdx];

    .filter(c => c.driver_id === driver.id && c.status !== "待指派")
    .sort((a,b) => a.order - b.order);

  const sections = [
    { label:"尚未接單", color:C.blue,  cases: driverCases.filter(c=>c.status==="已指派") },
    { label:"待取件",   color:C.navy,  cases: driverCases.filter(c=>c.status==="待取件"||c.status==="已接單") },
    { label:"已取件",   color:C.green, cases: driverCases.filter(c=>c.status==="已取件") },
  ];
  const [section, setSection] = useState(0);

  const cur = sections[section];
  const activeCount = driverCases.filter(c=>c.status!=="已取件").length;
  const doneCount = driverCases.filter(c=>c.status==="已取件").length;

  return (
    <>
      {/* Driver selector */}
      <div style={{ background:C.white, borderBottom:`1px solid ${C.grayBorder}` }}>
        <div style={{ display:"flex" }}>
          {TEAM_DRIVERS.map((d,i) => {
            const dc = cases.filter(c=>c.driver_id===d.id&&c.status!=="待指派");
            const alert = dc.some(c=>c.status==="已指派"&&c.wait_min>=5);
            return (
              <button key={d.id} onClick={() => { setDriverIdx(i); setSection(0); setSortMode(false); }}
                style={{ flex:1, background:driverIdx===i?C.blueSoft:"transparent", border:"none", borderBottom:`2.5px solid ${driverIdx===i?C.blue:"transparent"}`, padding:"12px 4px", cursor:"pointer", position:"relative" }}>
                {alert && <div style={{ position:"absolute", top:6, right:"calc(50% - 14px)", width:7, height:7, borderRadius:"50%", background:C.red, border:"1.5px solid white" }}/>}
                <div style={{ width:36, height:36, background:driverIdx===i?C.blue:C.grayLight, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", color:driverIdx===i?C.white:C.gray, fontWeight:900, fontSize:16, margin:"0 auto 4px" }}>{d.name[0]}</div>
                <div style={{ fontSize:12, fontWeight:driverIdx===i?800:500, color:driverIdx===i?C.blue:C.gray }}>{d.name}</div>
              </button>
            );
          })}
        </div>

        {/* Driver summary bar */}
        <div style={{ background:driverIdx===0?C.blueSoft:driverIdx===1?C.blueSoft:C.blueSoft, padding:"8px 16px", display:"flex", alignItems:"center", gap:10, borderTop:`1px solid ${C.grayBorder}` }}>
          <a href={`tel:${driver.phone}`}
            style={{ background:C.blue, borderRadius:8, padding:"6px 12px", color:C.white, fontSize:12, fontWeight:700, textDecoration:"none", display:"flex", alignItems:"center", gap:4 }}>
            📞 聯絡{driver.name}
          </a>
          <div style={{ flex:1, fontSize:11, color:C.textSub }}>
            進行中 <strong style={{ color:C.blue }}>{activeCount}</strong> 件・已完成 <strong style={{ color:C.green }}>{doneCount}</strong> 件
          </div>
        </div>

        {/* Section pills */}
        <div style={{ display:"flex", gap:8, padding:"10px 14px" }}>
          {sections.map((s,i) => (
            <button key={i} onClick={() => { setSection(i); setSortMode(false); }}
              style={{ flex:1, background:section===i?s.color:C.grayLight, border:"none", borderRadius:10, padding:"9px 4px", color:section===i?C.white:C.gray, fontWeight:section===i?800:500, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:4 }}>
              {s.label}
              {s.cases.length>0 && <span style={{ background:section===i?"rgba(255,255,255,0.3)":C.grayBorder, borderRadius:8, fontSize:11, padding:"0 5px", fontWeight:800 }}>{s.cases.length}</span>}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding:"14px 12px 80px" }}>
        {section===1 && cur.cases.length>0 && (
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            {cur.cases.length>1 && (
              <button onClick={() => setSortMode(m=>!m)}
                style={{ flex:1, background:sortMode?C.blue:C.grayLight, border:`1.5px solid ${sortMode?C.blue:C.grayBorder}`, borderRadius:10, padding:"10px 6px", color:sortMode?C.white:C.gray, fontSize:12, fontWeight:700, cursor:"pointer" }}>
                {sortMode?"✅ 完成排序":"⇅ 調整順序"}
              </button>
            )}
            {!sortMode && (
              <a href={"https://www.google.com/maps/dir/?api=1&destination=" + mapAddr(cur.cases[cur.cases.length-1].address) + (cur.cases.length>1 ? "&waypoints=" + cur.cases.slice(0,-1).map(c=>mapAddr(c.address)).join("|") : "") + "&travelmode=driving"}
                target="_blank" rel="noreferrer"
                style={{ flex:2, background:`linear-gradient(135deg,${C.blue},${C.blueMid})`, borderRadius:10, padding:"10px 6px", color:C.white, fontSize:12, fontWeight:800, textDecoration:"none", textAlign:"center", display:"flex", alignItems:"center", justifyContent:"center", gap:5, boxShadow:C.shadowBlue }}>
                🗺️ 一鍵開啟完整路線
              </a>
            )}
          </div>
        )}
        {cur.cases.length===0 && <div style={{ textAlign:"center", padding:"60px 20px" }}><div style={{ fontSize:44 }}>📭</div><div style={{ color:C.textMuted, fontSize:14, marginTop:10 }}>目前沒有{sections[section].label}案件</div></div>}
        {section!==1 ? cur.cases.map((c,idx) => (
          <CaseCard key={c.id} c={c} idx={idx} total={cur.cases.length}
            showRoute={false} sortMode={false} readOnly={true} onSession={onSession} />
        )) : (() => {
          const groups = [
            { label:"🌅 上午", key:"上午", cases: cur.cases.filter(c=>c.session==="上午") },
            { label:"🌆 下午", key:"下午", cases: cur.cases.filter(c=>c.session==="下午") },
            { label:"⏳ 未分類", key:null,  cases: cur.cases.filter(c=>!c.session) },
          ].filter(g=>g.cases.length>0);
          return groups.map(g => (
            <div key={g.key??'none'}>
              <div style={{ display:"flex", alignItems:"center", gap:6, margin:"6px 0 8px", padding:"6px 10px", background:g.key==="上午"?"#FEF9EC":g.key==="下午"?"#EFF6FF":"#F4F5F7", borderRadius:8 }}>
                <span style={{ fontSize:13, fontWeight:800, color:g.key==="上午"?"#B45309":g.key==="下午"?"#1D4ED8":C.textMuted }}>{g.label}</span>
                <span style={{ fontSize:11, color:C.textMuted }}>{g.cases.length} 件</span>
              </div>
              {g.cases.map((c) => { const i = cur.cases.indexOf(c); return (
                <CaseCard key={c.id} c={c} idx={i} total={cur.cases.length}
                  showRoute={true} routeNum={i+1} sortMode={sortMode} readOnly={true}
                  onMoveUp={() => onReorder(driver.id, i, i-1, section)}
                  onMoveDown={() => onReorder(driver.id, i, i+1, section)}
                  onSession={onSession} />
              );})}
            </div>
          ));
        })()}
      </div>
    </>
  );
}

function PendingTab({ cases, onAssign, onSession }) {
  const [selIds, setSelIds] = useState([]);
  const [pmOpen, setPmOpen] = useState(false);
  const pending = cases.filter(c => c.status==="待指派");
  const topCases = pending.filter(c => c.session!=="下午").sort((a,b) => (b.returned?1:0) - (a.returned?1:0));
  const pmCases  = pending.filter(c => c.session==="下午");
  const toggle = id => setSelIds(ids => ids.includes(id)?ids.filter(i=>i!==id):[...ids,id]);
  const selCases = pending.filter(c => selIds.includes(c.id));
  const topSelected = topCases.filter(c=>selIds.includes(c.id));

  return (
    <div style={{ padding:"14px 12px 100px" }}>

      {/* Batch bar */}
      {selIds.length>1 && (
        <div style={{ background:C.blueSoft, border:`1.5px solid ${C.blue}`, borderRadius:14, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ flex:1, color:C.blue, fontWeight:700, fontSize:13 }}>已選 {selIds.length} 件</div>
          <button onClick={() => onAssign(selCases)} style={{ background:C.blue, border:"none", borderRadius:10, padding:"8px 14px", color:C.white, fontSize:13, fontWeight:800, cursor:"pointer" }}>批次指派</button>
        </div>
      )}

      {pending.length===0 && (
        <div style={{ textAlign:"center", padding:"80px 20px" }}>
          <div style={{ fontSize:52 }}>🎉</div>
          <div style={{ fontWeight:800, fontSize:16, color:C.text, marginTop:12 }}>所有案件都已指派！</div>
        </div>
      )}

      {/* Select all bar */}
      {topCases.length>1 && (
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12, padding:"9px 14px", background:C.white, borderRadius:12, border:`1.5px solid ${C.grayBorder}` }}>
          <button onClick={() => setSelIds(topSelected.length===topCases.length ? selIds.filter(id=>!topCases.find(c=>c.id===id)) : [...new Set([...selIds,...topCases.map(c=>c.id)])])}
            style={{ display:"flex", alignItems:"center", gap:7, background:"none", border:"none", cursor:"pointer", padding:0 }}>
            <div style={{ width:22, height:22, borderRadius:6, border:`2px solid ${topSelected.length===topCases.length?C.blue:C.grayBorder}`, background:topSelected.length===topCases.length?C.blue:C.white, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              {topSelected.length===topCases.length && <span style={{ color:C.white, fontSize:12, fontWeight:900 }}>✓</span>}
              {topSelected.length>0 && topSelected.length<topCases.length && <span style={{ color:C.blue, fontSize:15, lineHeight:1 }}>−</span>}
            </div>
            <span style={{ fontSize:13, fontWeight:700, color:topSelected.length===topCases.length?C.blue:C.textSub }}>
              {topSelected.length===topCases.length?"取消全選":"全選"}
            </span>
          </button>
          <span style={{ fontSize:12, color:C.textMuted, flex:1 }}>
            {topSelected.length>0?`已選 ${topSelected.length} / ${topCases.length} 件`:"可多選批次指派"}
          </span>
        </div>
      )}

      {/* Top cases (未分類 + 上午) */}
      {topCases.map(c => (
        <PendingCard key={c.id} c={c}
          selected={selIds.includes(c.id)}
          onToggle={() => toggle(c.id)}
          onAssign={onAssign}
          onSession={onSession}
          isAfternoon={false} />
      ))}

      {/* 下午 collapsible banner */}
      {pmCases.length>0 && (
        <div style={{ marginTop:4 }}>
          <button onClick={() => setPmOpen(o=>!o)}
            style={{ width:"100%", background:"linear-gradient(135deg,#4338CA,#6366F1)", border:"none", borderRadius:14, padding:"14px 18px", display:"flex", alignItems:"center", gap:10, cursor:"pointer", marginBottom: pmOpen?12:0 }}>
            <span style={{ fontSize:18 }}>🌆</span>
            <span style={{ color:"#fff", fontWeight:800, fontSize:15, flex:1, textAlign:"left" }}>下午派件</span>
            <span style={{ background:"rgba(255,255,255,0.2)", color:"#fff", fontSize:12, fontWeight:700, padding:"3px 10px", borderRadius:10 }}>{pmCases.length} 件</span>
            <span style={{ color:"rgba(255,255,255,0.8)", fontSize:16, transition:"transform 0.2s", display:"inline-block", transform:pmOpen?"rotate(180deg)":"rotate(0deg)" }}>▼</span>
          </button>
          {pmOpen && pmCases.map(c => (
            <PendingCard key={c.id} c={c}
              selected={selIds.includes(c.id)}
              onToggle={() => toggle(c.id)}
              onAssign={onAssign}
              onSession={onSession}
              isAfternoon={true} />
          ))}
        </div>
      )}
    </div>
  );
}

          <button onClick={() => { setFueled(false); setFuelAmount(""); }}

            沒加油
          </button>

          <div style={{ marginBottom:16 }}>

            <div style={{ display:"flex", alignItems:"center", background:C.grayLight, border:`1.5px solid ${C.grayBorder}`, borderRadius:12, padding:"0 14px" }}>
              <span style={{ color:C.textMuted, fontSize:15, marginRight:6 }}>$</span>
              <input value={fuelAmount} onChange={e=>setFuelAmount(e.target.value.replace(/[^0-9]/g,""))}
                placeholder="例：500" inputMode="numeric"
                style={{ flex:1, background:"transparent", border:"none", padding:"12px 0", color:C.text, fontSize:16, fontWeight:700, outline:"none", fontFamily:"inherit" }} />
              <span style={{ color:C.textMuted, fontSize:13 }}>元</span>

        )}

        <div style={{ background:C.blueSoft, borderRadius:10, padding:"10px 14px", marginBottom:20, display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ fontSize:14 }}>🕐</span>
          <span style={{ fontSize:12, color:C.textSub }}>抵達時間將自動記錄為送出當下時間</span>
        </div>

        <button onClick={() => canSubmit && onConfirm({ endMileage, fueled, fuelAmount: fueled?fuelAmount:0, arrivalTime: nowStr() })}

          style={{ width:"100%", background:canSubmit?`linear-gradient(135deg,${C.green},#27855A)`:C.grayLight, border:"none", borderRadius:14, padding:15, color:canSubmit?C.white:C.textMuted, fontSize:16, fontWeight:800, cursor:canSubmit?"pointer":"default", marginBottom:10 }}>

        <button onClick={onClose} style={{ width:"100%", background:"transparent", border:`1.5px solid ${C.grayBorder}`, borderRadius:14, padding:13, color:C.textSub, fontSize:14, cursor:"pointer" }}>取消</button>
      </div>
    </div>
  );
}

function MainApp({ me, meName, role, vehicle, startMileage, onLogout }) {
  const [cases, setCases] = useState(initCases);
  const [tab, setTab] = useState(0);
  const [pickupModal, setPickupModal] = useState(null);
  const [rejectModal, setRejectModal] = useState(null);
  const [assignTarget, setAssignTarget] = useState(null);
  const [tripEndModal, setTripEndModal] = useState(false);
  const [tripReport, setTripReport] = useState(null);

  const alertCount = cases.filter(c=>(c.status==="已指派"&&c.wait_min>=5)).length;
  const pendingCount = cases.filter(c=>c.status==="待指派").length;

  const handleTripEnd = (report) => { setTripReport(report); setTripEndModal(false); };

  const handleAccept = id => setCases(cs=>cs.map(c=>c.id===id?{...c,status:"已接單"}:c));
  const handleReject = (id, remark) => {
    setCases(cs => cs.map(c => c.id===id ? { ...c, status:"待指派", driver_id:null, returned:true, remark: remark ? `↩️ ${meName}退回：${remark}` : `↩️ ${meName}退回`, wait_min:0 } : c));
    setRejectModal(null);
  };
  const handlePickup = ({pcs,address,remark,sigData,photoUrl}) => { setCases(cs=>cs.map(c=>c.id===pickupModal?{...c,status:"已取件",pcs_actual:pcs,address,remark,pickup_at:nowStr(),sig_url:sigData||null,photo_url:photoUrl||null}:c)); setPickupModal(null); };
  const handleUndo = id => setCases(cs=>cs.map(c=>c.id===id?{...c,status:"待取件",pickup_at:null}:c));
  const handleSession = (id, session) => setCases(cs=>cs.map(c=>c.id===id?{...c,session}:c));
  const handleAssign = driverId => {
    const ids = assignTarget.map(c=>c.id);
    setCases(cs=>cs.map(c=>ids.includes(c.id)?{...c,status:"已指派",driver_id:driverId,assigned_at:nowStr(),wait_min:0,returned:false}:c));
    setAssignTarget(null);
    setTab(1);
  };
  const handleReorder = (driverId, from, to) => {
    const relevant = cases.filter(c=>c.driver_id===driverId&&(c.status==="待取件"||c.status==="已接單")).sort((a,b)=>a.order-b.order);
    if (to<0||to>=relevant.length) return;
    const list=[...relevant]; const [item]=list.splice(from,1); list.splice(to,0,item);
    setCases(prev=>[...prev.filter(c=>!(c.driver_id===driverId&&(c.status==="待取件"||c.status==="已接單"))),...list.map((c,i)=>({...c,order:i}))]);
  };

  const mc = cases.find(c=>c.id===pickupModal);
  const rc = cases.find(c=>c.id===rejectModal);

  const isCaptain = role === "captain";
  const TABS = isCaptain ? [
    { label:"我的案件", icon:"📦", badge:null },
    { label:"全員",     icon:"👥", badge:alertCount>0?alertCount:null, badgeColor:C.red },
    { label:"待指派",   icon:"📋", badge:pendingCount>0?pendingCount:null, badgeColor:C.orange },
  ] : [
    { label:"我的案件", icon:"📦", badge:null },
  ];

  return (
    <div style={{ background:C.bg, minHeight:"100vh", fontFamily:"'Inter','Noto Sans TC',system-ui,sans-serif", maxWidth:430, margin:"0 auto", paddingBottom:isCaptain?64:0 }}>

      {/* Header */}
      <div style={{ background:`linear-gradient(135deg,${C.navy},${C.blue} 60%,${C.blueMid})`, padding:"18px 20px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
              <span style={{ fontSize:10, color:"rgba(255,255,255,0.6)", letterSpacing:2, textTransform:"uppercase" }}>GMOP Manager</span>
              <button onClick={onLogout} style={{ background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.25)", borderRadius:6, padding:"1px 7px", color:"rgba(255,255,255,0.8)", fontSize:10, cursor:"pointer" }}>登出</button>
            </div>
            <div style={{ fontSize:22, fontWeight:900, color:C.white }}>{meName}，出發 🚛</div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:2 }}>
              <span style={{ fontSize:12, color:"rgba(255,255,255,0.7)" }}>{new Date().toLocaleDateString("zh-TW")}</span>
              <span style={{ background:"rgba(255,255,255,0.18)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:6, padding:"1px 8px", color:C.white, fontSize:11, fontWeight:800, letterSpacing:0.5 }}>🚐 {vehicle}</span>
            </div>
          </div>
          {isCaptain && (
            <div style={{ display:"flex", gap:8 }}>
              {alertCount>0 && (
                <button onClick={() => setTab(1)}
                  style={{ background:C.red, border:"none", borderRadius:12, padding:"8px 12px", textAlign:"center", cursor:"pointer", WebkitTapHighlightColor:"transparent" }}>
                  <div style={{ color:C.white, fontWeight:900, fontSize:20, lineHeight:1 }}>{alertCount}</div>
                  <div style={{ color:"rgba(255,255,255,0.85)", fontSize:9 }}>待處理 ↗</div>
                </button>
              )}
              {pendingCount>0 && (
                <button onClick={() => setTab(2)}
                  style={{ background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.25)", borderRadius:12, padding:"8px 12px", textAlign:"center", cursor:"pointer", WebkitTapHighlightColor:"transparent" }}>
                  <div style={{ color:C.white, fontWeight:900, fontSize:20, lineHeight:1 }}>{pendingCount}</div>
                  <div style={{ color:"rgba(255,255,255,0.75)", fontSize:9 }}>待指派 ↗</div>
                </button>
              )}
            </div>
          )}
        </div>

        {/* Trip end button / summary */}
        <div style={{ marginTop:12 }}>
          {!tripReport ? (
            <button onClick={() => setTripEndModal(true)}
              style={{ width:"100%", background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:10, padding:"9px 14px", color:C.white, fontSize:13, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
              🏁 收件結束後回報里程／加油
            </button>
          ) : (
            <div style={{ background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:10, padding:"9px 14px", display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:14 }}>✅</span>
              <div style={{ flex:1, fontSize:11, color:"rgba(255,255,255,0.9)" }}>
                回程 {tripReport.endMileage}・{tripReport.fueled ? `加油 $${tripReport.fuelAmount}` : "未加油"}・抵達 {tripReport.arrivalTime}
              </div>
              <button onClick={() => setTripEndModal(true)} style={{ background:"rgba(255,255,255,0.2)", border:"none", borderRadius:6, padding:"3px 8px", color:C.white, fontSize:10, cursor:"pointer" }}>修改</button>
            </div>
          )}
        </div>
      </div>

      {/* Tab content */}
      {tab===0 && <MyCasesTab cases={cases} me={me} onAccept={handleAccept} onPickup={id=>setPickupModal(id)} onReject={id=>setRejectModal(id)} onUndo={handleUndo} onReorder={handleReorder} onSession={handleSession}/>}
      {isCaptain && tab===1 && <TeamTab cases={cases} me={me} onReorder={handleReorder} onSession={handleSession}/>}
      {isCaptain && tab===2 && <PendingTab cases={cases} onAssign={setAssignTarget} onSession={handleSession}/>}

      {/* Bottom tab bar - only for captain (multiple tabs) */}
      {isCaptain && (
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:430, background:C.white, borderTop:`1px solid ${C.grayBorder}`, display:"flex", zIndex:100, paddingBottom:"env(safe-area-inset-bottom)" }}>
          {TABS.map((t,i) => (
            <button key={i} onClick={() => setTab(i)}
              style={{ flex:1, background:"transparent", border:"none", padding:"10px 4px 8px", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, position:"relative" }}>
              {t.badge && (
                <div style={{ position:"absolute", top:6, right:"calc(50% - 16px)", background:t.badgeColor, color:C.white, borderRadius:10, fontSize:10, fontWeight:800, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 4px", border:"1.5px solid white" }}>{t.badge}</div>
              )}
              <span style={{ fontSize:20 }}>{t.icon}</span>
              <span style={{ fontSize:11, fontWeight:tab===i?800:500, color:tab===i?C.blue:C.textMuted }}>{t.label}</span>
              {tab===i && <div style={{ width:20, height:2.5, background:C.blue, borderRadius:2 }}/>}
            </button>
          ))}
        </div>
      )}

      {pickupModal && mc && <PickupModal c={mc} onClose={()=>setPickupModal(null)} onConfirm={handlePickup}/>}
      {rejectModal && rc && <RejectModal c={rc} onClose={()=>setRejectModal(null)} onConfirm={r=>handleReject(rejectModal,r)}/>}
      {assignTarget && <AssignModal cases={assignTarget} onClose={()=>setAssignTarget(null)} onAssign={handleAssign}/>}
      {tripEndModal && <TripEndModal startMileage={startMileage} vehicle={vehicle} onClose={()=>setTripEndModal(false)} onConfirm={handleTripEnd}/>}
    </div>
  );
}

// ── Accounts ──────────────────────────────────────────────
const ACCOUNTS = {
  kira: { id: "D03", name: "軒照", role: "driver" },
  jime: { id: "D02", name: "士峰", role: "driver" },
  nldw: { id: "D01", name: "世龍", role: "captain" },
};

// ── Login Screen ──────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState(false);

  const handleSubmit = () => {
    const account = ACCOUNTS[code.trim().toLowerCase()];
    if (account) {
      setError(false);
      onLogin(account);
    } else {
      setError(true);
    }
  };

  return (
    <div style={{ background:`linear-gradient(160deg,${C.navy} 0%,${C.blue} 55%,${C.blueMid} 100%)`, minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, fontFamily:"'Inter','Noto Sans TC',system-ui,sans-serif" }}>
      <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:20, width:72, height:72, display:"flex", alignItems:"center", justifyContent:"center", fontSize:34, marginBottom:20, backdropFilter:"blur(8px)" }}>📦</div>
      <div style={{ color:C.white, fontSize:24, fontWeight:900, marginBottom:4 }}>GMOP Manager</div>
      <div style={{ color:"rgba(255,255,255,0.75)", fontSize:13, marginBottom:36 }}>司機派件管理系統</div>

      <div style={{ background:C.white, borderRadius:20, padding:24, width:"100%", maxWidth:340, boxShadow:"0 8px 32px rgba(0,0,0,0.2)" }}>
        <div style={{ fontSize:13, color:C.textSub, fontWeight:700, marginBottom:8 }}>登入代碼</div>
        <input
          value={code}
          onChange={e => { setCode(e.target.value); setError(false); }}
          onKeyDown={e => e.key === "Enter" && handleSubmit()}
          placeholder="請輸入你的登入代碼"
          autoCapitalize="none"
          autoCorrect="off"
          style={{ width:"100%", background:C.grayLight, border:`1.5px solid ${error?C.red:C.grayBorder}`, borderRadius:12, padding:"14px 16px", color:C.text, fontSize:16, boxSizing:"border-box", outline:"none", marginBottom:error?8:16, fontFamily:"inherit" }}
        />
        {error && <div style={{ color:C.red, fontSize:12, marginBottom:16 }}>⚠️ 代碼不正確，請再試一次</div>}
        <button onClick={handleSubmit}
          style={{ width:"100%", background:`linear-gradient(135deg,${C.blue},${C.blueMid})`, border:"none", borderRadius:14, padding:15, color:C.white, fontSize:16, fontWeight:800, cursor:"pointer", boxShadow:C.shadowBlue }}>
          登入
        </button>
      </div>

      <div style={{ color:"rgba(255,255,255,0.5)", fontSize:11, marginTop:24, textAlign:"center" }}>
        忘記代碼請聯絡隊長或公司管理員
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────
// ── Vehicle Select Screen ─────────────────────────────────
const VEHICLES = ["RDJ-8685", "RDT-6185", "BKV-1973"];

function VehicleSelectScreen({ driverName, onConfirm, onBack }) {
  const [selected, setSelected] = useState(null);
  const [custom, setCustom] = useState("");
  const [useCustom, setUseCustom] = useState(false);
  const [mileage, setMileage] = useState("");

  const plate = useCustom ? custom.trim().toUpperCase() : selected;
  const canGo = plate && mileage.trim() !== "";

  return (
    <div style={{ background:`linear-gradient(160deg,${C.navy} 0%,${C.blue} 55%,${C.blueMid} 100%)`, minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, fontFamily:"'Inter','Noto Sans TC',system-ui,sans-serif" }}>
      <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:20, width:64, height:64, display:"flex", alignItems:"center", justifyContent:"center", fontSize:30, marginBottom:16, backdropFilter:"blur(8px)" }}>🚚</div>
      <div style={{ color:C.white, fontSize:20, fontWeight:900, marginBottom:2 }}>{driverName}，今天開哪台車？</div>
      <div style={{ color:"rgba(255,255,255,0.75)", fontSize:13, marginBottom:28 }}>請選擇車輛並填寫出發里程</div>

      <div style={{ background:C.white, borderRadius:20, padding:24, width:"100%", maxWidth:340, boxShadow:"0 8px 32px rgba(0,0,0,0.2)" }}>
        <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:16 }}>
          {VEHICLES.map(v => (
            <button key={v} onClick={() => { setSelected(v); setUseCustom(false); }}
              style={{ display:"flex", alignItems:"center", gap:12, background:(!useCustom && selected===v)?C.blueSoft:C.grayLight, border:`1.5px solid ${(!useCustom && selected===v)?C.blue:C.grayBorder}`, borderRadius:14, padding:"14px 16px", cursor:"pointer" }}>
              <span style={{ fontSize:20 }}>🚐</span>
              <span style={{ flex:1, textAlign:"left", fontSize:16, fontWeight:800, color:(!useCustom && selected===v)?C.blue:C.text, letterSpacing:1 }}>{v}</span>
              {(!useCustom && selected===v) && <span style={{ color:C.blue, fontSize:18 }}>✓</span>}
            </button>
          ))}
        </div>

        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:16 }}>
          <div style={{ flex:1, height:1, background:C.grayBorder }} />
          <span style={{ fontSize:11, color:C.textMuted }}>或</span>
          <div style={{ flex:1, height:1, background:C.grayBorder }} />
        </div>

        <div style={{ fontSize:12, color:C.textSub, fontWeight:600, marginBottom:8 }}>手動輸入其他車號</div>
        <input
          value={custom}
          onChange={e => { setCustom(e.target.value); setUseCustom(true); setSelected(null); }}
          placeholder="例：ABC-1234"
          autoCapitalize="characters"
          style={{ width:"100%", background:C.grayLight, border:`1.5px solid ${useCustom?C.blue:C.grayBorder}`, borderRadius:12, padding:"12px 14px", color:C.text, fontSize:15, boxSizing:"border-box", outline:"none", marginBottom:20, fontFamily:"inherit", letterSpacing:1 }}
        />

        <div style={{ fontSize:12, color:C.textSub, fontWeight:600, marginBottom:8 }}>🛣️ 出發里程數</div>
        <input
          value={mileage}
          onChange={e => setMileage(e.target.value.replace(/[^0-9]/g, ""))}
          placeholder="例：45280"
          inputMode="numeric"
          style={{ width:"100%", background:C.grayLight, border:`1.5px solid ${C.grayBorder}`, borderRadius:12, padding:"12px 14px", color:C.text, fontSize:16, boxSizing:"border-box", outline:"none", marginBottom:20, fontFamily:"inherit", fontWeight:700 }}
        />

        <button onClick={() => canGo && onConfirm(plate, mileage)} disabled={!canGo}
          style={{ width:"100%", background:canGo?`linear-gradient(135deg,${C.blue},${C.blueMid})`:C.grayLight, border:"none", borderRadius:14, padding:15, color:canGo?C.white:C.textMuted, fontSize:16, fontWeight:800, cursor:canGo?"pointer":"default", marginBottom:10, boxShadow:canGo?C.shadowBlue:"none" }}>
          確認出發
        </button>
        <button onClick={onBack}
          style={{ width:"100%", background:"transparent", border:"none", padding:8, color:C.textMuted, fontSize:13, cursor:"pointer" }}>
          ← 返回登入
        </button>
      </div>
    </div>
  );
}

function App() {
  const [account, setAccount] = useState(null);
  const [vehicle, setVehicle] = useState(null);
  const [startMileage, setStartMileage] = useState(null);

  if (!account) {
    return <LoginScreen onLogin={setAccount} />;
  }

  if (!vehicle) {
    return (
      <VehicleSelectScreen
        driverName={account.name}
        onConfirm={(plate, mileage) => { setVehicle(plate); setStartMileage(mileage); }}
        onBack={() => setAccount(null)}
      />
    );
  }

  return (
    <MainApp
      me={account.id}
      meName={account.name}
      role={account.role}
      vehicle={vehicle}
      startMileage={startMileage}
      onLogout={() => { setAccount(null); setVehicle(null); setStartMileage(null); }}
    />
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
